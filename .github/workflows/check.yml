# Typecheck and test the core on every push to main (other branches are not built; auto-pr opens a PR for them).
name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --ignore-scripts
      - run: pnpm --filter @obs-config-loader/core typecheck
      - run: pnpm --filter @obs-config-loader/core test

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --ignore-scripts
      - run: pnpm --filter @obs-config-loader/desktop typecheck
      - run: pnpm --filter @obs-config-loader/desktop test
      - run: pnpm --filter @obs-config-loader/desktop build
      # the same packaging the release does, minus publishing: a mistake shows up on the PR, not on release day
      - name: Package (unpacked)
        run: pnpm --filter @obs-config-loader/desktop exec electron-builder --linux dir --publish never
